user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # No rate limiting: this configuration is for local development and testing only;
    # nginx.dev.conf and nginx.prod.conf limit requests.

    resolver 127.0.0.11 valid=30s;

    client_max_body_size 260M;

    server {
        listen 80;
        server_name acc.biodata.ceitec.cz;

        location /api {
            proxy_pass http://api:8000;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

}
