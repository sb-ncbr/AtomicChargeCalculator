# Exclude query strings, cookies and authorization headers from usage logs.
log_format usage escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"user_agent":"$http_user_agent","origin":"$http_origin",'
    '"acc_client":"$http_x_acc_client"}';

access_log /var/log/nginx/access.log usage;
