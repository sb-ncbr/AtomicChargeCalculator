name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/frontend/acc

      - name: Lint
        run: pnpm lint
        working-directory: ./src/frontend/acc

      - name: Build
        run: pnpm build
        working-directory: ./src/frontend/acc
