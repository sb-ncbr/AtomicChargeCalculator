name: Backend CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: 
      image: sbncbr/chargefw2
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates python3-dev libpq-dev gcc

      - name: Install dependencies
        run: uv sync --locked --no-python-downloads --python /usr/bin/python3
        working-directory: ./src/backend

      - name: Run tests
        run: uv run --no-sync pytest ./tests
        working-directory: ./src/backend
